{% extends "nav.html" %}
{% block form %}
{% if messages %}
    <div class="mb-4">
        {% for message in messages %}
            <div class="p-3 mb-2 rounded text-center
              {% if message.tags == 'success' %} bg-green-100 text-green-800 {% endif %}">
                {{ message }}
            </div>
        {% endfor %}
      </div>
{% endif %}

<div class="max-w-xl mx-auto bg-white p-8 mt-10 rounded-2xl shadow-lg">
  <h2 class="text-2xl font-bold text-indigo-600 mb-6 text-center">
    Add New Event
  </h2>

  <form method="POST" class="space-y-5">
    {% csrf_token %}
    {% for field in event_form %}
    <div>
      <label class="block text-gray-700 font-medium mb-1">
        {{ field.label }}
      </label>
      {{ field }}
    </div>
    {% endfor %}

    <button
      type="submit"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
      Save Event
    </button>
  </form>
</div>
{% endblock form %}
